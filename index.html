<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Моя галактика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="galaxy-screen" id="galaxyView">
    <canvas id="galaxySky"></canvas>
    <div class="g-hud g-hud-top">
      <div class="g-title">ТВОЯ ГАЛАКТИКА</div>
      <div class="g-sub" id="galaxySub">&nbsp;</div>
    </div>
    <div class="g-hud g-hud-bottom-l" id="galaxyStats"></div>
    <div class="g-hud g-hud-bottom-r" id="galaxyHint">ТЯНИ, ЧТОБЫ ВРАЩАТЬ</div>
    <div class="g-status" id="galaxyStatus"></div>
  </div>

  <script src="app.js?v=6"></script>
</body>
</html>
